# pnpm 11 起，包管理设置放在这里（package.json 里的 pnpm 字段不再读取）。
#
# 关于 esbuild 的构建脚本：
# 它的 postinstall 只做「校验/复制平台二进制」这件事，各平台的二进制由 @esbuild/* 可选依赖直接提供，
# 所以跳过脚本也能正常构建（本地和 CI 都已验证）。
# pnpm 11 会把未审批的构建脚本当成错误返回非零退出码，因此安装时统一加 --ignore-scripts：
#   pnpm install --ignore-scripts
# CI 里同理（见 .github/workflows/deploy.yml）。
onlyBuiltDependencies:
  - esbuild

# 跳过每次 pnpm run 之前的隐式 install 检查：这个项目没有 workspace 依赖需要同步。
verifyDepsBeforeRun: false
