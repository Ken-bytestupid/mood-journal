name: Deploy to GitHub Pages

on:
  push:
    # 本地仓库的默认分支是 master，同时兼容以后改成 main 的情况
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts：esbuild 的 postinstall 只做二进制校验，跳过不影响构建；
      # 不加的话 pnpm 11 会以 ERR_PNPM_IGNORED_BUILDS 返回非零退出码，CI 直接失败。
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 项目站点部署在 /仓库名/ 下；如果仓库叫 xxx.github.io 则是根路径
      - name: Compute base path
        id: base
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          if [[ "$name" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE: ${{ steps.base.outputs.value }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
